<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <!--
    ⚠ CE FICHIER EST LA MOITIÉ DU PORTAGE MOBILE.
    Unity ne peut rien contre ce qui se passe AVANT lui : le zoom du navigateur, le défilement de
    la page, le geste de retour depuis le bord, l'appui long qui ouvre un menu système, la barre
    d'URL qui mange le bas de l'écran — donc le pavé directionnel. Aucun de ces défauts ne se voit
    dans l'éditeur, aucun ne lève d'erreur, et chacun rend le jeu injouable au doigt. Ils se règlent
    tous ici, en CSS et en quatre écouteurs.

    `maximum-scale=1` + `user-scalable=no` : sans eux, un double-appui pour sauter ZOOME la page.
    `viewport-fit=cover` : le canevas passe sous l'encoche plutôt que de laisser deux bandes.
  -->
  <meta name="viewport"
        content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#8fd0f2">

  <!--
    ⚠⚠ CETTE PAGE NE DOIT JAMAIS ÊTRE MISE EN CACHE — et c'est le maillon dont dépendent tous les
    autres. Elle est la seule à porter l'identifiant de build qui invalide le chargeur, le wasm et
    les données. Gardée en cache, elle continue de désigner les fichiers de l'ancien build : le
    garde-cache existe, il est correct, et il ne s'applique jamais. Elle pèse quelques kilo-octets,
    la retélécharger à chaque lancement ne coûte rien.
  -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>{{{ PRODUCT_NAME }}}</title>
  <meta name="description" content="Le beach volley des Blobs souriants, jouable dans le navigateur.">
  <link rel="icon" type="image/png" href="TemplateData/favicon.png">
  <style>
    /* La police du jeu, pour que la page d'attente ne soit pas d'un autre jeu. */
    @font-face {
      font-family: "Fredoka";
      src: url("TemplateData/Fredoka.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --sable: #f2ddb4;
      --ciel: #8fd0f2;
      --encre: #2c5f86;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--ciel);
      font-family: "Fredoka", system-ui, sans-serif;
      color: var(--encre);

      /* Le doigt ne fait JAMAIS défiler, zoomer ni rafraîchir : il joue. `touch-action: none`
         supprime au passage le délai de 300 ms que certains navigateurs gardent pour distinguer
         un appui d'un double-appui — délai qui, sur un saut, se ressent comme une entrée molle. */
      touch-action: none;
      overscroll-behavior: none;

      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;   /* appui long = menu « copier l'image » sur iOS, sinon */
      -webkit-tap-highlight-color: transparent;
    }

    /* Le jeu est cadré en 16/9 : le fond déborde derrière, il ne doit donc pas
       être noir — une bande noire autour d'une plage se voit comme un défaut. */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(#8fd0f2 0%, #bfe6f7 55%, var(--sable) 100%);
    }

    canvas {
      display: block;
      background: var(--ciel);
      /* Sans cela le navigateur lisse le rendu au redimensionnement. */
      image-rendering: auto;
      outline: none;
      touch-action: none;
    }

    /* Sur mobile, le jeu prend tout : le cadre 16/9 centré est un luxe de fenêtre de bureau, et
       sur un téléphone il rendrait les boutons tactiles plus petits pour rien. `dvh` suit la barre
       d'URL qui se rétracte — sans quoi le bas du jeu, donc le pavé directionnel, se retrouve
       caché derrière elle ; `100%` reste le repli des navigateurs qui l'ignorent. */
    body.mobile canvas {
      width: 100vw !important;
      height: 100% !important;
      height: 100dvh !important;
    }

    /* -------------------------------------------------------------- attente */

    .voile {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 1.4rem;
      padding-bottom: 12vh;
      background: url("TemplateData/affiche.jpg") center / cover no-repeat;
      transition: opacity 0.4s ease;
    }

    .voile.parti {
      opacity: 0;
      pointer-events: none;
    }

    .carte {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
      padding: 1.2rem 2.4rem;
      border-radius: 22px;
      background: rgba(255, 250, 240, 0.88);
      box-shadow: 0 10px 30px rgba(20, 60, 90, 0.18);
    }

    .titre {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.02em;
    }

    .barre {
      width: min(60vw, 380px);
      height: 12px;
      border-radius: 999px;
      background: rgba(44, 95, 134, 0.16);
      overflow: hidden;
    }

    .jauge {
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #6fc46f, #4aa3df);
      transition: width 0.15s ease;
    }

    .note {
      margin: 0;
      font-size: 0.95rem;
      opacity: 0.75;
      text-align: center;
    }

    /* Message d'erreur : discret, mais lisible sans ouvrir la console. */
    .alerte {
      position: fixed;
      left: 50%;
      bottom: 1.2rem;
      transform: translateX(-50%);
      max-width: min(90vw, 700px);
      padding: 0.7rem 1.1rem;
      border-radius: 14px;
      background: rgba(255, 244, 214, 0.95);
      box-shadow: 0 6px 18px rgba(20, 60, 90, 0.2);
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>

  <div class="voile" id="attente">
    <div class="carte">
      <p class="titre" id="etat">Chargement de la plage…</p>
      <div class="barre"><div class="jauge" id="jauge"></div></div>
      <p class="note" id="commandes">Joueur 1 : A / D / W &nbsp;—&nbsp; Joueur 2 : ← / → / ↑</p>
    </div>
  </div>

  <div class="alerte" id="alerte"></div>

  <!-- ?v=__BUILD_ID__ : posé par le build. Sans lui, le navigateur ressert le chargeur
       d'un build et le wasm d'un autre — un mélange qui ne ressemble pas à un cache,
       mais à un jeu cassé. -->
  <script src="Build/{{{ LOADER_FILENAME }}}?v=__BUILD_ID__"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var attente = document.querySelector("#attente");
    var jauge = document.querySelector("#jauge");
    var etat = document.querySelector("#etat");
    var alerte = document.querySelector("#alerte");
    var commandes = document.querySelector("#commandes");

    // Un navigateur mobile, ou une machine sans souris. `maxTouchPoints` est le seul test fiable :
    // la chaîne d'agent utilisateur ment (mode bureau d'un téléphone, iPad qui se déclare Mac).
    // Il décide de trois choses : le cadrage, la note d'accueil, et le rapport de pixels.
    var mobile = (navigator.maxTouchPoints || 0) > 1 ||
                 /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

    if (mobile) {
      document.body.classList.add("mobile");
      // ⚠ « A / D / W » n'est pas seulement inutile au doigt : c'est la première phrase que lit un
      // joueur mobile, et elle lui parle d'un clavier qu'il n'a pas.
      commandes.textContent = "Tenez l'appareil en largeur — les commandes s'affichent à l'écran.";
    }

    // Le jeu est composé pour du 16/9 : sur un écran de bureau on garde ce cadre et on centre,
    // plutôt que d'étirer la plage à la fenêtre. Sur mobile, le CSS ci-dessus prend le relais et
    // le jeu occupe tout — la caméra du jeu, elle, garde le terrain entier visible.
    var ratio = {{{ WIDTH }}} / {{{ HEIGHT }}};

    function cadrer() {
      if (mobile) return;

      var largeur = window.innerWidth;
      var hauteur = window.innerHeight;
      if (largeur / hauteur > ratio) largeur = Math.round(hauteur * ratio);
      else hauteur = Math.round(largeur / ratio);
      canvas.style.width = largeur + "px";
      canvas.style.height = hauteur + "px";
    }

    cadrer();
    window.addEventListener("resize", cadrer);
    // La rotation d'un téléphone ne produit pas toujours un `resize` au bon moment.
    window.addEventListener("orientationchange", cadrer);

    // Les touches du jeu font défiler la page si on les laisse au navigateur :
    // la barre d'espace saute d'un écran, les flèches suivent le curseur.
    var confisquees = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Tab"];
    window.addEventListener("keydown", function (e) {
      if (confisquees.indexOf(e.key) >= 0) e.preventDefault();
    }, { passive: false });

    // Un navigateur ne laisse pas un son démarrer avant que la page ait été
    // touchée. Unity ouvre son contexte audio suspendu : sans ce réveil, la
    // musique du menu ne se déclenche qu'au hasard d'un clic.
    function reveillerAudio() {
      var ctx = window.WEBAudio && window.WEBAudio.audioContext;
      if (ctx && ctx.state !== "running") ctx.resume();
    }
    ["pointerdown", "touchstart", "keydown"].forEach(function (nom) {
      window.addEventListener(nom, reveillerAudio);
    });

    // Le clavier ne parvient au jeu que si la toile a le focus.
    function donnerLeClavier() { canvas.focus(); }
    window.addEventListener("pointerdown", donnerLeClavier);
    window.addEventListener("focus", donnerLeClavier);

    function signaler(message, type) {
      if (type === "error") {
        alerte.textContent = message;
        alerte.style.display = "block";
      }
      console.log(message);
    }

    var config = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}?v=__BUILD_ID__",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}?v=__BUILD_ID__",
      codeUrl: "Build/{{{ CODE_FILENAME }}}?v=__BUILD_ID__",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
      showBanner: signaler,
    };

    // ⚠ LE RÉGLAGE DE PERFORMANCE LE PLUS RENTABLE DU PORTAGE MOBILE.
    // Un téléphone récent annonce un rapport de pixels de 3 : Unity rendrait alors NEUF fois plus
    // de pixels que la dalle logique n'en montre, sur un GPU qui vaut le dixième d'une carte de
    // bureau. Le jeu est fait d'aplats et d'un maillage de gelée — il n'a presque rien à y gagner,
    // et la cadence, elle, s'effondre sans qu'aucune erreur ne le dise.
    if (mobile) config.devicePixelRatio = 1;

    createUnityInstance(canvas, config, function (avancement) {
      jauge.style.width = (avancement * 100) + "%";
      if (avancement > 0.9) etat.textContent = "On gonfle le ballon…";
    }).then(function (instance) {
      window.jeu = instance;
      attente.classList.add("parti");
      donnerLeClavier();
      reveillerAudio();
      installerGestesMobiles(instance);
    }).catch(function (erreur) {
      etat.textContent = "Le jeu n'a pas pu démarrer.";
      signaler(erreur, "error");
    });

    /**
     * Les trois gestes du navigateur qu'il faut désarmer, et le seul qu'il faut armer.
     */
    function installerGestesMobiles(instance) {
      // 1. L'appui long ouvre le menu contextuel par-dessus le jeu. Il ne se supprime qu'ici :
      //    `-webkit-touch-callout` ne couvre qu'iOS.
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); }, { passive: false });

      // 2. Le double-appui zoome encore sur iOS malgré la balise viewport — c'est un geste séparé,
      //    et il tombe exactement sur le rythme d'un joueur qui saute deux fois de suite.
      canvas.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });

      // 3. Le glissement depuis le bord déclenche « page précédente » sur Android — et glisser
      //    d'un bord est justement ce qu'on fait sur un pavé directionnel collé au bord. Un
      //    `touchmove` non passif est le seul moyen de le retenir.
      canvas.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

      if (!mobile) return;

      // 4. Le plein écran, lui, doit être ARMÉ — et il exige un geste de l'utilisateur : l'appeler
      //    au chargement échoue silencieusement. Une seule fois, au premier contact ; ensuite le
      //    joueur reste maître, le geste système de sortie continue de fonctionner.
      //    Sur iPhone l'API n'existe pas : le `try` évite qu'une exception n'arrête le script.
      var arme = true;
      canvas.addEventListener("pointerdown", function () {
        if (!arme) return;
        arme = false;
        try { instance.SetFullscreen(1); } catch (e) { /* iOS : pas de plein écran, on joue quand même */ }
      });
    }
  </script>
</body>
</html>
